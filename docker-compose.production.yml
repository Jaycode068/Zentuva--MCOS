name: zentuva

# Full-stack compose file: builds and runs postgres, redis, api, AND web as containers.
#
# This is NOT the day-to-day development workflow. For local development, run
#   pnpm infra:up   (starts only postgres + redis via docker-compose.dev.yml)
#   pnpm dev        (runs apps/web and apps/api directly on the host, with hot reload)
# See docs/development/local-development.md.
#
# This file exists for production-like full-stack verification (e.g. "does the Docker
# image actually build and run correctly") and, longer-term, as the basis for a real
# production deployment. Building apps/web and apps/api into containers is slow and has
# no hot reload, which is why it's kept separate from the infra-only dev compose file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentuva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentuva}
      POSTGRES_DB: ${POSTGRES_DB:-zentuva}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zentuva}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zentuva}:${POSTGRES_PASSWORD:-zentuva}@postgres:5432/${POSTGRES_DB:-zentuva}
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/web/.env
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
