name: zentuva-dev

# Infra-only compose file for local development. Starts ONLY postgres + redis — never
# apps/web or apps/api, which always run directly on the host during development for
# fast hot reload and unrestricted VS Code debugging (see Development Philosophy in
# docs/development/local-development.md).
#
# Use the root package scripts instead of calling docker compose directly:
#   pnpm infra:up       start postgres + redis
#   pnpm infra:down     stop them
#   pnpm infra:restart  restart them
#   pnpm infra:logs     tail their logs
#   pnpm infra:reset    wipe all data and start fresh
#
# For the full containerized stack (including apps/web and apps/api as Docker images),
# see docker-compose.production.yml — that is NOT the daily development workflow.
#
# The disposable test Postgres instance lives in its OWN file, docker-compose.test.yml,
# under its OWN Compose project name — NOT as a profile within this file. This file's
# project name (`zentuva-dev`, above) previously also hosted a `postgres-test` service on
# the `test` Compose profile; that was the root cause of the 2026-10-14 data-loss incident:
# `docker compose --profile test down -v` does not scope `down`/`-v` to the named profile —
# `down` tears down the ENTIRE project regardless of `--profile`, so it removed this file's
# `postgres` container and its `postgres_dev_data`/`redis_dev_data` volumes along with the
# test service. A
# Compose profile is an `up`-time filter, not a project-level isolation boundary — it must
# never be relied on as one. See docker-compose.test.yml for the corrected design.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentuva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentuva}
      POSTGRES_DB: ${POSTGRES_DB:-zentuva}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zentuva}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
